name: zeronutri

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zeronutri-app:latest
    container_name: 0nutri-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/zeronutri
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      TZ: America/Sao_Paulo
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      NOTIFICATIONS_TICK_SECRET: ${NOTIFICATIONS_TICK_SECRET:-}
    volumes:
      - zeronutri_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/today"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: 0nutri-db
    restart: unless-stopped
    ports:
      # No homelab altere DB_PORT se 5432 estiver ocupado
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zeronutri
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - zeronutri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zeronutri"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    image: zeronutri-caddy:latest
    container_name: 0nutri-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      TZ: America/Sao_Paulo
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - zeronutri_caddy_data:/data
      - zeronutri_caddy_config:/config

  cron:
    image: alpine:3
    container_name: 0nutri-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NOTIFICATIONS_TICK_SECRET: ${NOTIFICATIONS_TICK_SECRET:-}
      TZ: America/Sao_Paulo
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl tzdata >/dev/null
        printf '* * * * * curl -fsS -X POST -H "Authorization: Bearer %s" http://app:3000/api/notifications/tick >/dev/null 2>&1\n' "$$NOTIFICATIONS_TICK_SECRET" > /etc/crontabs/root
        exec crond -f -l 2

volumes:
  zeronutri_postgres_data:
  zeronutri_uploads:
  zeronutri_caddy_data:
  zeronutri_caddy_config:
